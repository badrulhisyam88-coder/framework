[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assist-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Core framework
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    # Templating (HTMX backend)
    "jinja2>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    # Database
    "aiosqlite>=0.20.0,<1.0.0",
    # HTTP client (NVD sync, ZAP adapter)
    "httpx>=0.27.0,<1.0.0",
    # XML parsing (Nmap output)
    "lxml>=5.2.0,<6.0.0",
    # Async task support
    "anyio>=4.3.0,<5.0.0",
    # Static file serving
    "aiofiles>=23.2.0,<25.0.0",
    # YAML parsing (wordlist loader)
    "pyyaml>=6.0.0,<7.0.0",
    # PDF report generation
    "weasyprint>=62.0",
    # SSH credential validation (lazy import in ssh plugin)
    "paramiko>=3.0.0,<4.0.0",
    # SMB null-session enumeration (lazy import in smb plugin)
    "impacket>=0.11.0",
    # Metasploit RPC client (lazy import in metasploit service)
    "pymetasploit3>=1.0",
    # Vector store for semantic vault search (vault_embedder.py)
    "chromadb>=0.5.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "sdk*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
